# Burgspiel — nginx site config (reverse proxy + static frontend)
#
# Domain: burg.paulbartsch.de — hinter Cloudflare-Proxy ("orange Wolke").
# Cloudflare SSL/TLS-Modus auf "Full" stellen: Besucher <-HTTPS-> Cloudflare
# <-HTTPS-> dieser Origin (Cert unten). setup.sh erzeugt das Origin-Cert.
#
# Statisches Spiel: __APP_DIR__/dist; Node-Backend lokal 127.0.0.1:8787.
# __APP_DIR__ wird von deploy/setup.sh durch das echte Repo-Verzeichnis ersetzt.

# --- Cloudflare: echte Besucher-IP wiederherstellen ---
# Ohne das sieht nginx/das Backend nur Cloudflare-IPs (Rate-Limit/Logs).
# Liste ggf. via https://www.cloudflare.com/ips/ aktualisieren.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name burg.paulbartsch.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name burg.paulbartsch.de;

    # Origin-Cert (selbstsigniert von setup.sh, passend zu CF-Modus "Full").
    # Für "Full (strict)": durch ein Cloudflare-Origin-Certificate ersetzen.
    ssl_certificate     /etc/ssl/burgspiel/origin.crt;
    ssl_certificate_key /etc/ssl/burgspiel/origin.key;

    root __APP_DIR__/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend: REST-API und Admin-Dashboard auf das Node-Backend leiten
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statisches Frontend; SPA-Fallback auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
