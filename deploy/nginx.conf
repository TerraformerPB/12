# Burgspiel — nginx site config (reverse proxy + static frontend)
#
# Platzhalter __DOMAIN__ wird von deploy/setup.sh ersetzt.
# Manuell: __DOMAIN__ durch deine Domain ersetzen und nach
# /etc/nginx/sites-available/burgspiel kopieren, dann verlinken.
#
# Das statische Spiel liegt in /opt/burgspiel/dist, das Node-Backend
# lauscht lokal auf 127.0.0.1:8787 (siehe deploy/burgspiel.service).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/burgspiel/dist;
    index index.html;

    # gzip für die statischen Assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend: REST-API und Admin-Dashboard auf das Node-Backend leiten
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statisches Frontend; SPA-Fallback auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lange Caches für gehashte Build-Assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
